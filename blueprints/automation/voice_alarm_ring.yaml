blueprint:
  name: "Voice Alarm: Ring"
  description: "Every minute, rings any due alarm on its satellite until stopped (configurable max). One-time alarms removed when they fire."
  domain: automation
  input:
    voice_alarms_text:
      name: "Voice Alarms Text Helper"
      description: "The input_text helper storing alarms (HH:MM<repeat><device_index>)"
      selector:
        entity:
          domain: input_text
    satellite_devices:
      name: "Satellite Devices"
      description: "List of assist_satellite entity IDs in priority order (matches config)"
      selector:
        entity:
          domain: assist_satellite
          multiple: true
    satellite_ringing_flags:
      name: "Satellite Ringing Flags"
      description: "List of input_boolean entities for each satellite's ringing state (same order as satellites)"
      selector:
        entity:
          domain: input_boolean
          multiple: true
    max_ring_time:
      name: "Max Ring Time (minutes)"
      description: "Maximum time an alarm rings before auto-stop"
      default: 30
      selector:
        number:
          min: 1
          max: 120
          step: 1
          mode: box

trigger:
  - platform: time_pattern
    minutes: "/1"

action:
  - variables:
      items: >
        {{ states(voice_alarms_text).split(',') | select('match','[0-9][0-9]:[0-9][0-9][odwe][0-9]+$') | list }}
      wd: "{{ now().weekday() }}"
      max_seconds: "{{ max_ring_time * 60 }}"
      satellites: !input satellite_devices
      ringing_flags: !input satellite_ringing_flags

  - variables:
      due_by_device: >
        {% set hhmm = now().strftime('%H:%M') %}
        {% set ns = namespace(d=[]) %}
        {% for i in items %}
          {% set dev_idx = i[6:] | int %}
          {% if i[:5] == hhmm and dev_idx < satellites | length and
              (i[5:6] in ['o','d'] or
               (i[5:6] == 'w' and wd | int(0) < 5) or
               (i[5:6] == 'e' and wd | int(0) >= 5)) %}
            {% set ns.d = ns.d + [i] %}
          {% endif %}
        {% endfor %}
        {{ ns.d }}

  - stop: "none due"
    if:
      - "{{ due_by_device | length == 0 }}"

  - service: input_text.set_value
    target:
      entity_id: !input voice_alarms_text
    data:
      value: >
        {% set ns = namespace(k=[]) %}
        {% for i in items %}
          {% if not (i in due_by_device and i[5:6] == 'o') %}
            {% set ns.k = ns.k + [i] %}
          {% endif %}
        {% endfor %}
        {{ ns.k | join(',') }}

  - variables:
      started: "{{ as_timestamp(now()) }}"

  - parallel:
      {% for sat_idx in range(satellites | length) %}
      - sequence:
          - if:
              - "{{ due_by_device | select('match', '.*[0-9]' ~ sat_idx ~ '$') | list | length > 0 }}"
            then:
              - service: input_boolean.turn_on
                target:
                  entity_id: "{{ ringing_flags[sat_idx] }}"
              - repeat:
                  sequence:
                    - service: assist_satellite.announce
                      target:
                        entity_id: "{{ satellites[sat_idx] }}"
                      data:
                        message: "Alarm. It is {{ now().strftime('%-I:%M %p') }}. Say stop alarm to turn it off."
                      continue_on_error: true
                    - delay:
                        seconds: 8
                  while:
                    - condition: state
                      entity_id: "{{ ringing_flags[sat_idx] }}"
                      state: "on"
                    - condition: template
                      value_template: "{{ as_timestamp(now()) - (started | float(0)) < max_seconds }}"
              - service: input_boolean.turn_off
                target:
                  entity_id: "{{ ringing_flags[sat_idx] }}"
      {% endfor %}

mode: parallel
max_exceeded: silent