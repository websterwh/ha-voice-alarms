blueprint:
  name: "Voice Alarm: Stop, Cancel, List"
  description: "Stop a ringing alarm on this device; cancel one/all alarms for this device; list alarms for this device."
  domain: automation
  input:
    voice_alarms_text:
      name: "Voice Alarms Text Helper"
      description: "The input_text helper storing alarms (HH:MM<repeat><device>)"
      selector:
        entity:
          domain: input_text
    parse_alarm_time_script:
      name: "Parse Alarm Time Script"
      description: "Script that parses voice time input"
      selector:
        entity:
          domain: script
    voice_pe_ringing:
      name: "Voice PE Ringing Flag"
      description: "input_boolean for Voice PE alarm ringing state"
      selector:
        entity:
          domain: input_boolean
    bedroom_echo_ringing:
      name: "Bedroom Echo Ringing Flag"
      description: "input_boolean for Bedroom Echo alarm ringing state"
      selector:
        entity:
          domain: input_boolean
    voice_pe_device_id:
      name: "Voice PE Device ID"
      description: "Device ID for Voice PE satellite"
      selector:
        text:
    bedroom_echo_device_id:
      name: "Bedroom Echo Device ID"
      description: "Device ID for Bedroom Echo satellite"
      selector:
        text:

variables:
  voice_pe_device_id: !input voice_pe_device_id
  bedroom_echo_device_id: !input bedroom_echo_device_id

trigger:
  - platform: conversation
    id: stop
    command:
      - "(stop|dismiss|silence|turn off|shut off) [the|my] alarm"
  - platform: conversation
    id: cancel_one
    command:
      - "(cancel|delete|remove|clear) [the|my] alarm"
  - platform: conversation
    id: cancel_time
    command:
      - "(cancel|delete|remove|clear) [the|my] {time} alarm"
      - "(cancel|delete|remove|clear) [the|my] alarm (for|at) {time}"
  - platform: conversation
    id: cancel_all
    command:
      - "(cancel|delete|remove|clear) (all|every) [of] [my|the] alarms"
  - platform: conversation
    id: list
    command:
      - "what alarms (do I have|are set)"
      - "list [my|the] alarms"
      - "what time is [the|my] alarm [set for]"
      - "when is [the|my] alarm"

action:
  - variables:
      device_code: >
        {% set did = trigger.device_id %}
        {% if did == voice_pe_device_id %}V
        {% elif did == bedroom_echo_device_id %}E
        {% else %}{% endif %}
      items: >
        {{ states(voice_alarms_text).split(',') | select('match','[0-9][0-9]:[0-9][0-9][odwe][VE]$') | select('match','.*[VE]' ~ device_code ~ '$') | list }}

  - stop: "Say that to a voice device."
    if:
      - "{{ device_code == '' }}"

  - choose:
      - conditions:
          - condition: trigger
            id: stop
        sequence:
          - choose:
              - conditions:
                  - condition: state
                    entity_id: !input voice_pe_ringing
                    state: "on"
                  - condition: template
                    value_template: "{{ device_code == 'V' }}"
                sequence:
                  - service: input_boolean.turn_off
                    target:
                      entity_id: !input voice_pe_ringing
                  - response_variable: response
                    service: conversation.set_conversation_response
                    data:
                      response: "Alarm off."
              - conditions:
                  - condition: state
                    entity_id: !input bedroom_echo_ringing
                    state: "on"
                  - condition: template
                    value_template: "{{ device_code == 'E' }}"
                sequence:
                  - service: input_boolean.turn_off
                    target:
                      entity_id: !input bedroom_echo_ringing
                  - response_variable: response
                    service: conversation.set_conversation_response
                    data:
                      response: "Alarm off."
              - default:
                  - response_variable: response
                    service: conversation.set_conversation_response
                    data:
                      response: "No alarm is ringing."

      - conditions:
          - condition: trigger
            id: cancel_one
        sequence:
          - choose:
              - conditions:
                  - condition: template
                    value_template: "{{ items | length == 0 }}"
                sequence:
                  - response_variable: response
                    service: conversation.set_conversation_response
                    data:
                      response: "No alarms are set."
              - conditions:
                  - condition: template
                    value_template: "{{ items | length == 1 }}"
                sequence:
                  - service: input_text.set_value
                    target:
                      entity_id: !input voice_alarms_text
                    data:
                      value: >
                        {{ (states(voice_alarms_text).split(',') | select('match','[0-9][0-9]:[0-9][0-9][odwe][VE]$') | reject('match','.*[VE]' ~ device_code ~ '$') | list) | join(',') }}
                  - response_variable: response
                    service: conversation.set_conversation_response
                    data:
                      response: "Alarm cancelled."
              - default:
                  - response_variable: response
                    service: conversation.set_conversation_response
                    data:
                      response: "You have {{ items | length }} alarms. Say cancel the 7 AM alarm, or cancel all alarms."

      - conditions:
          - condition: trigger
            id: cancel_time
        sequence:
          - service: script.turn_on
            target:
              entity_id: !input parse_alarm_time_script
            data:
              variables:
                text: "{{ trigger.slots.time }}"
            response_variable: parsed
          - variables:
              kept: >
                {% set ns = namespace(k=[]) %}
                {% for i in states(voice_alarms_text).split(',') %}
                  {% if i | select('match','[0-9][0-9]:[0-9][0-9][odwe][VE]$') %}
                    {% if i[:5] not in (parsed.cands | default([])) or not i.endswith(device_code) %}
                      {% set ns.k = ns.k + [i] %}
                    {% endif %}
                  {% else %}
                    {% set ns.k = ns.k + [i] %}
                  {% endif %}
                {% endfor %}
                {{ ns.k }}
          - stop: "I couldn't find that alarm."
            if:
              - "{{ kept | length == states(voice_alarms_text).split(',') | select('match','[0-9][0-9]:[0-9][0-9][odwe][VE]$') | list | length }}"
          - service: input_text.set_value
            target:
              entity_id: !input voice_alarms_text
            data:
              value: "{{ kept | join(',') }}"
          - response_variable: response
            service: conversation.set_conversation_response
            data:
              response: "Alarm cancelled."

      - conditions:
          - condition: trigger
            id: cancel_all
        sequence:
          - service: input_text.set_value
            target:
              entity_id: !input voice_alarms_text
            data:
              value: >
                {{ (states(voice_alarms_text).split(',') | reject('match','.*[VE]' ~ device_code ~ '$') | list) | join(',') }}
          - response_variable: response
            service: conversation.set_conversation_response
            data:
              response: "All alarms cancelled."

      - conditions:
          - condition: trigger
            id: list
        sequence:
          - response_variable: response
            service: conversation.set_conversation_response
            data:
              response: >
                {% if items | length == 0 %}No alarms are set.
                {% else %}You have {{ items | length }} alarm{{ 's' if items | length > 1 }}:
                  {% for i in items %}
                    {{ today_at(i[:5]).strftime('%-I:%M %p') }}
                    {{ {'o':'','d':' every day','w':' on weekdays','e':' on weekends'}[i[5:6]] }}
                    {{ ', ' if not loop.last }}
                  {% endfor %}.{% endif %}

mode: queued
max_exceeded: silent