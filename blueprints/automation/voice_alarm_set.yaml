blueprint:
  name: "Voice Alarm: Set"
  description: >
    Set a one-time, daily, weekday, or weekend alarm by voice on any configured
    satellite. Each repeat type has its own trigger with explicit phrases so no
    wildcard slot can swallow the time value. All storage and scheduling are
    delegated to the Voice Alarms integration (voice_alarms.command).
  domain: automation
  source_url: https://github.com/websterwh/ha-voice-alarms/blob/master/blueprints/automation/voice_alarm_set.yaml
  homeassistant:
    min_version: "2026.10.0"
  input:
    satellite_devices:
      name: Satellite Devices
      description: >
        All assist_satellite entities this automation should handle. Only the
        satellite whose device_id matches trigger.device_id will be addressed.
      selector:
        entity:
          domain: assist_satellite
          multiple: true

variables:
  satellites: !input satellite_devices

trigger:
  - platform: conversation
    id: once
    command:
      - "set [a|an|my] alarm (for|at) {time}"
      - "set [a|an|my] alarm {time}"
      - "wake me up (at|by) {time}"
      - "alarm (for|at) {time}"

  - platform: conversation
    id: daily
    command:
      - "set [a|an|my] daily alarm (for|at) {time}"
      - "set [a|an|my] daily alarm {time}"
      - "set [a|an|my] (every day|everyday) alarm (for|at) {time}"
      - "set [a|an|my] (every day|everyday) alarm {time}"
      - "set [a|an|my] (recurring|repeating) alarm (for|at) {time}"
      - "set [a|an|my] (recurring|repeating) alarm {time}"

  - platform: conversation
    id: weekdays
    command:
      - "set [a|an|my] weekday alarm (for|at) {time}"
      - "set [a|an|my] weekday alarm {time}"
      - "set [a|an|my] weekdays alarm (for|at) {time}"
      - "set [a|an|my] weekdays alarm {time}"

  - platform: conversation
    id: weekends
    command:
      - "set [a|an|my] weekend alarm (for|at) {time}"
      - "set [a|an|my] weekend alarm {time}"
      - "set [a|an|my] weekends alarm (for|at) {time}"
      - "set [a|an|my] weekends alarm {time}"

action:
  # Resolve which satellite spoke. Reject absent (0 matches) and ambiguous
  # (2+ matches, i.e. multiple entities share the same device).
  - variables:
      satellite_entity: >
        {% set ns = namespace(found='', count=0) %}
        {% for sat in satellites %}
          {% if trigger.device_id is not none and device_id(sat) == trigger.device_id %}
            {% set ns.found = sat %}
            {% set ns.count = ns.count + 1 %}
          {% endif %}
        {% endfor %}
        {% if ns.count == 1 %}{{ ns.found }}{% endif %}

  - if:
      - condition: template
        value_template: "{{ satellite_entity == '' }}"
    then:
      - set_conversation_response: "Sorry, I couldn't identify which satellite you're speaking from."
      - stop: "Satellite absent or ambiguous."

  # Normalize STT time format: "9 30 p.m." -> "9:30 PM", "5.51 PM" -> "5:51 PM"
  - variables:
      normalized_time: >-
        {{
          trigger.slots.time
          | replace('p.m.', 'PM')
          | replace('a.m.', 'AM')
          | replace('p.m', 'PM')
          | replace('a.m', 'AM')
          | replace('.', ':')
          | regex_replace('\\s+(\\d\\d)\\s*(AM|PM)', ':\\1 \\2')
          | regex_replace('\\s+(\\d)\\s*(AM|PM)', ':0\\1 \\2')
          | trim
        }}
  # Map trigger id → repeat value passed to the integration.
  - variables:
      repeat_value: once
  - choose:
      - conditions:
          - condition: trigger
            id: once
        sequence:
          - variables:
              repeat_value: once
      - conditions:
          - condition: trigger
            id: daily
        sequence:
          - variables:
              repeat_value: daily
      - conditions:
          - condition: trigger
            id: weekdays
        sequence:
          - variables:
              repeat_value: weekdays
      - conditions:
          - condition: trigger
            id: weekends
        sequence:
          - variables:
              repeat_value: weekends

  - action: voice_alarms.command
    data:
      satellite: "{{ satellite_entity }}"
      operation: set
      time: "{{ normalized_time }}"
      repeat: "{{ repeat_value }}"
    response_variable: result

  - set_conversation_response: "{{ result.response }}"

mode: queued
max: 30