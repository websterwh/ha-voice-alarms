blueprint:
  name: "Voice Alarm: Set"
  description: "Set an alarm by voice, optionally repeating (daily, weekdays, weekends). Per-device isolation."
  domain: automation
  input:
    voice_alarms_text:
      name: "Voice Alarms Text Helper"
      description: "The input_text helper storing alarms (HH:MM<repeat><device_index>)"
      selector:
        entity:
          domain: input_text
    parse_alarm_time_script:
      name: "Parse Alarm Time Script"
      description: "Script that parses voice time input"
      selector:
        entity:
          domain: script
    satellite_devices:
      name: "Satellite Devices"
      description: "List of assist_satellite entity IDs in priority order"
      selector:
        entity:
          domain: assist_satellite
          multiple: true
    max_ring_time:
      name: "Max Ring Time (minutes)"
      description: "Maximum time an alarm rings before auto-stop"
      default: 30
      selector:
        number:
          min: 1
          max: 120
          step: 1
          mode: box

trigger:
  - platform: conversation
    command:
      - "set [a|an|my] [daily|weekday|weekdays|weekend|weekends|recurring|repeating] alarm (for|at) {time}"
      - "set [a|an|my] [daily|weekday|weekdays|weekend|weekends|recurring|repeating] alarm {time}"
      - "wake me up at {time}"
      - "alarm (for|at) {time}"

action:
  - service: script.turn_on
    target:
      entity_id: !input parse_alarm_time_script
    data:
      variables:
        text: "{{ trigger.slots.time }}"
    response_variable: parsed

  - stop: "I didn't catch the time."
    if:
      - "{{ parsed.hhmm | default('') == '' }}"

  - variables:
      repeat_code: >
        {% set t = trigger.sentence | lower %}
        {% if 'weekday' in t %}w
        {% elif 'weekend' in t %}e
        {% elif 'daily' in t or 'every day' in t or 'everyday' in t or 'recurring' in t or 'repeating' in t %}d
        {% else %}o{% endif %}
      device_index: >
        {% set satellites = satellite_devices %}
        {% set did = trigger.device_id %}
        {% for i in range(satellites | length) %}
          {% if satellites[i] == did %}{{ i }}{% endif %}
        {% endfor %}
      items: >
        {{ states(voice_alarms_text).split(',') | select('match','[0-9][0-9]:[0-9][0-9][odwe][0-9]+$') | list }}

  - variables:
      entry: "{{ parsed.hhmm ~ repeat_code ~ device_index }}"
      label: >
        {{ today_at(parsed.hhmm).strftime('%-I:%M %p') }}
        {{
          {'o':'','d':' every day','w':' on weekdays','e':' on weekends'}[repeat_code]
        }}

  - stop: "Say that to a voice device."
    if:
      - "{{ device_index | string == '' }}"

  - stop: "That alarm is already set."
    if:
      - "{{ entry in items }}"

  - stop: "You have too many alarms."
    if:
      - "{{ items | length >= 30 }}"

  - service: input_text.set_value
    target:
      entity_id: !input voice_alarms_text
    data:
      value: "{{ (items + [entry]) | join(',') }}"

  - response_variable: response
    service: conversation.set_conversation_response
    data:
      response: "Alarm set for {{ label }}."

mode: queued
max_exceeded: silent